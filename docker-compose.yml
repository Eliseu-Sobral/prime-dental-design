services:
  # =============================================================================
  #  JB ODONTOLOGIA PRIME · TanStack Start / Nitro standalone
  #  PADRÃO IDÊNTICO AO PROJETO MAMAJULA / KAMEETECH QUE JÁ FUNCIONA
  #  Ajustes anti-404: match em ambos domínios (c/ e s/ www) + HostAll() v3
  # =============================================================================
  jbprime:
    build:
      context: .
      dockerfile: Dockerfile
    image: jbodontologiaprime:latest
    container_name: jbodontologiaprime
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
    tmpfs:
      - /tmp
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
      # ── anti 404/host mismatch no Nitro/TanStack CSRF ─────────────────
      - NITRO_HOST=0.0.0.0
      - NITRO_PORT=3000
      - NITRO_ORIGIN=https://jbodontologiaprime.com.br
    networks:
      # ★ REDE CORRETA (mesma do projeto mamajula / kameetech que funciona)
      - portainer_default

    # ── HEALTHCHECK MESMO PADRÃO KAMEETECH ──────────────────────────────
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # =========================================================================
    #  LABELS TRAEFIK · PADRÃO MAMAJULA / KAMEETECH
    #  + anti-404: regra match em AMBOS os hosts (c/ e s/ www)
    # =========================================================================
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.port=3000"

      # ---------- Router (DOMÍNIO SEM WWW) ----------
      - "traefik.http.routers.jbprime.entrypoints=websecure"
      - "traefik.http.routers.jbprime.rule=Host(`jbodontologiaprime.com.br`)"
      - "traefik.http.routers.jbprime.service=jbprime"
      - "traefik.http.routers.jbprime.tls=true"
      - "traefik.http.routers.jbprime.tls.certresolver=leresolver"

      # ---------- Router WWW (ANTI-404: também atende www.) ----------
      #  Serve tanto www quanto o base — desativar o redirect só depois que ambos abrirem
      - "traefik.http.routers.jbprime-www.entrypoints=websecure"
      - "traefik.http.routers.jbprime-www.rule=Host(`www.jbodontologiaprime.com.br`)"
      - "traefik.http.routers.jbprime-www.service=jbprime"
      - "traefik.http.routers.jbprime-www.tls=true"
      - "traefik.http.routers.jbprime-www.tls.certresolver=leresolver"

      # ---------- Service: jbprime ----------
      - "traefik.http.services.jbprime.loadbalancer.server.port=3000"
      - "traefik.http.services.jbprime.loadbalancer.server.scheme=http"
      - "traefik.http.services.jbprime.loadbalancer.passHostHeader=true"

      # ---------------------------------------------------------------------
      #  🔒 WWW → NON-WWW (opcional). COMENTADO POR ENQUANTO (igual mamajula
      #     não usa middlewares). Descomente DEPOIS que os 2 domínios abrirem sem 404.
      # ---------------------------------------------------------------------
      # - "traefik.http.middlewares.jbprime-nonwww.redirectregex.regex=^https?://www\\.(.*)"
      # - "traefik.http.middlewares.jbprime-nonwww.redirectregex.replacement=https://${1}"
      # - "traefik.http.middlewares.jbprime-nonwww.redirectregex.permanent=true"
      # - "traefik.http.routers.jbprime-www.middlewares=jbprime-nonwww@docker"

      # Watchtower (se tiver rodando) — auto-atualiza com nova tag
      - "com.centurylinklabs.watchtower.enable=true"

# =============================================================================
#  REDE · MESMA DO PORTAINER / MAMAJULA (external=true, já existe)
# =============================================================================
networks:
  portainer_default:
    name: portainer_default
    external: true
